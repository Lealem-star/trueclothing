<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>True Clothing</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Noto+Sans+Ethiopic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1E1B4B;--mut:#5B5B73;--bg:#fff;--soft:#F1F0F7;--line:#E2E2EA;--prim:#1E1B4B;--onp:#fff;--pr:#DCDAF5;--ok:#D6EFE0;--okt:#14532D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#ECEBFA;--mut:#A9A8C6;--bg:#14132B;--soft:#201F3F;--line:#34335C;--prim:#F2B705;--onp:#1E1B4B;--pr:#34326A;--ok:#1B3A2A;--okt:#9BE3B5}}
:root[data-theme=dark]{--ink:#ECEBFA;--mut:#A9A8C6;--bg:#14132B;--soft:#201F3F;--line:#34335C;--prim:#F2B705;--onp:#1E1B4B;--pr:#34326A;--ok:#1B3A2A;--okt:#9BE3B5}
*{box-sizing:border-box}html,body{min-height:100%}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'DM Sans','Noto Sans Ethiopic',system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h2{margin:18px 0 8px;font-size:20px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.lg{font-size:18px}nav,.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ct{max-width:980px;margin:0 auto;padding:16px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:0;background:var(--soft);color:var(--ink);font-weight:600;cursor:pointer}
.chip.on{background:var(--prim);color:var(--onp)}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--prim);color:var(--onp);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.acc{background:#F2B705;color:#1E1B4B}.out{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.hero{background:#1E1B4B;color:#fff;border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;gap:14px}.hero h1{margin:0;font-size:clamp(24px,5vw,38px);line-height:1.15;max-width:560px}.hero .out{color:#fff;border-color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin:12px 0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.pc{border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:2px;padding:0;cursor:pointer}
.tile{height:160px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:700}
.card{background:var(--soft);border-radius:12px;padding:14px;border:0;text-align:left;margin-bottom:10px}.sv{display:flex;flex-direction:column;cursor:pointer;margin:0}
.mut{color:var(--mut);font-size:13px}
.in{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.lb{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.tag{display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:700;background:var(--soft)}.t1{background:#F2B705;color:#1E1B4B}.t2{background:var(--pr)}.t3{background:var(--ok);color:var(--okt)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:9}
.md{background:var(--bg);border-radius:16px;padding:20px;width:100%;max-width:480px}.md h3{margin:0 0 6px;font-size:20px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E1B4B;color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90%}.toast.on{opacity:1}
.ft{display:flex;justify-content:space-between;align-items:center;padding:16px;border-top:1px solid var(--line);margin-top:24px}
.ad{display:flex;min-height:100vh}.sb{width:200px;background:#1E1B4B;padding:20px 12px;display:flex;flex-direction:column;gap:4px;flex:none}.sb b{color:#fff;padding:0 12px 14px;font-size:18px}
.nv{background:none;border:0;color:#D9D8F0;text-align:left;padding:12px;border-radius:10px;font-weight:600;cursor:pointer;min-height:44px}.nv.on{background:#F2B705;color:#1E1B4B}
.mn{flex:1;padding:24px;min-width:0}.mn h1{margin:0 0 14px;font-size:24px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}.st .card{margin:0}.st b{font-size:22px;display:block}
.tb{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}.tr{display:grid;grid-template-columns:70px 1.4fr 1fr 1fr 1fr 110px;gap:8px;align-items:center;padding:6px 14px;min-height:52px;border-bottom:1px solid var(--line);min-width:640px}.tr:last-child{border:0}.th{background:var(--soft);font-weight:700;font-size:13px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.end{justify-content:flex-end;margin-top:16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.bar{display:flex;gap:4px;margin:10px 0 4px}.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}.bar i.d{background:var(--prim)}.bar i.c{background:#F2B705}
.two{display:grid;grid-template-columns:300px 1fr;gap:16px;margin-top:12px}.sel{outline:2px solid var(--prim)}
.ck{display:flex;align-items:center;gap:10px;min-height:36px}.ck input{width:20px;height:20px}
@media(max-width:760px){.ad{flex-direction:column}.sb{width:auto;flex-direction:row;flex-wrap:wrap}.sb b{width:100%;padding-bottom:4px}.two{grid-template-columns:1fr}.sc{overflow-x:auto;flex-wrap:nowrap}.mn{padding:16px}}
</style>
</head>
<body>
<div id="app"></div><div id="m"></div><div id="t" class="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ETB=n=>Number(n||0).toLocaleString('en')+' ETB',ST=['Received','In production','Shipped','Delivered'],dg=s=>String(s||'').replace(/\D/g,''),today=()=>new Date().toISOString().slice(0,10);
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const tg=s=>`<span class="tag ${({Received:'t1',New:'t1','In production':'t2',Quoted:'t2',Shipped:'t3',Converted:'t3'})[s]||''}">${esc(s)}</span>`;
const L={en:{home:'Home',req:'Request',acc:'Account',in:'Sign in',h1:'Shifon and Habesha dresses, made your way',browse:'Browse catalog',call:'Call to order',order:'Order now'},am:{home:'መነሻ',req:'ጥያቄ',acc:'መለያ',in:'መግቢያ',h1:'የተለያዩ ሽፎኖች እና የሀበሻ ልብሶች',browse:'ካታሎግ ይመልከቱ',call:'ይደውሉ',order:'ይዘዙ'}};
const FLD={'Custom design':[['Fabric and color','text'],['Bust (cm)','number'],['Waist (cm)','number'],['Hip (cm)','number'],['Length (cm)','number'],['Needed by','date']],Wholesale:[['Quantity (pieces)','text'],['Product or fabric','text']],Abroad:[['Delivery city and country','text'],['Needed by','date'],['Design or fabric','text']]};
let S={lang:'en',route:'home',cat:'All',tab:'Custom design',acct:'orders',ar:'dash',of:'All',rf:'All',q:'',f:{},step:0};
const t=k=>L[S.lang][k];
function seed(){return{n:2,log:['Demo data loaded'],set:{name:'True clothing',phone:'0985698888',tg:'t.me/Trueclothing16',aO:1,aR:1,telebirr:1,cbe:1,bank:0},
prods:[{id:'p1',en:'Sample shifon dress',cat:'Shifon',price:2500,sizes:['S','M','L','XL'],desc:'Sample product. Edit or replace it in Admin, Products.',pub:1},{id:'p2',en:'Sample Habesha dress 1',cat:'Habesha',price:4200,sizes:['S','M','L'],desc:'Sample product.',pub:1},{id:'p3',en:'Sample Habesha dress 2',cat:'Habesha',price:3800,sizes:['M','L'],desc:'Sample product.',pub:1},{id:'p4',en:'Sample fabric',cat:'Fabric',price:900,sizes:[],desc:'Sample fabric, price per piece.',pub:1}],
orders:[{id:'#0001',name:'Sample customer',phone:'0911000000',type:'Custom design',desc:'Sample custom order',total:5000,status:'In production',pay:'Partly paid',date:today()},{id:'#0002',name:'Sample customer 2',phone:'0911000001',type:'Ready-made',desc:'Sample dress ×1',total:2500,status:'Shipped',pay:'Paid',date:today()}],
reqs:[{id:'r1',type:'Wholesale',name:'Sample trader',phone:'0922000000',d:{'Quantity (pieces)':'50'},status:'New',quote:'',date:today()}]}}
let DB;try{DB=JSON.parse(localStorage.getItem('tc1'))}catch(e){}DB=DB||seed();
const save=()=>{try{localStorage.setItem('tc1',JSON.stringify(DB))}catch(e){}},log=m=>{DB.log.unshift(m);DB.log=DB.log.slice(0,6)},nid=()=>'#'+String(++DB.n).padStart(4,'0');
const prod=id=>DB.prods.find(p=>p.id===id),ord=id=>DB.orders.find(o=>o.id===id),rq=id=>DB.reqs.find(r=>r.id===id);
function toast(m){const e=$('#t');e.textContent=m;e.className='toast on';clearTimeout(toast.h);toast.h=setTimeout(()=>e.className='toast',2800)}
function keep(){document.querySelectorAll('input[id],textarea[id],select[id]').forEach(e=>{S.f[e.id]=e.type==='checkbox'?e.checked:e.value})}
function R(c){if(c)S.f={};else keep();draw()}
function draw(){const fa=document.activeElement&&document.activeElement.id;
$('#app').innerHTML=S.admin?(S.adm?adminV():loginV()):shop();
$('#m').innerHTML=S.modal?`<div class="ov" id="ov"><div class="md">${modal()}</div></div>`:'';
for(const id in S.f){const e=document.getElementById(id);if(e){if(e.type==='checkbox')e.checked=S.f[id];else e.value=S.f[id]}}
if(fa&&S.f[fa]!==undefined){const e=document.getElementById(fa);if(e)e.focus()}}
const F=(id,l,ty,ph)=>`<label class="lb" for="${id}">${l}</label><input class="in" id="${id}" type="${ty||'text'}" placeholder="${ph||''}">`;
const chips=(arr,cur,a)=>arr.map(c=>`<button class="chip${cur===c?' on':''}" data-a="${a}" data-v="${c}">${c}</button>`).join('');
/* ---------- shop ---------- */
function shop(){const r=S.route;
return `<header class="hd"><b class="lg">True Clothing</b><nav>${['home','req','acc'].map(k=>`<button class="chip${r===k?' on':''}" data-a="go" data-v="${k}">${t(k==='acc'&&!S.user&&!S.adm?'in':k)}</button>`).join('')}<button class="chip" data-a="lang">${S.lang==='en'?'አማ':'EN'}</button></nav></header><main class="ct">${r==='home'?home():r==='req'?reqv():acct()}</main>`}
function home(){const ps=DB.prods.filter(p=>p.pub&&(S.cat==='All'||p.cat===S.cat));
return `<section class="hero"><h1>${t('h1')}</h1><div class="rw"><button class="btn acc" data-a="scr">${t('browse')}</button><a class="btn out" href="tel:${dg(DB.set.phone)}" style="text-decoration:none">${t('call')}</a></div></section>
<div class="rw sc" id="grid" style="margin-top:16px">${chips(['All','Shifon','Habesha','Fabric'],S.cat,'cat')}</div>
<div class="g">${ps.map(p=>`<button class="pc" data-a="prod" data-v="${p.id}"><div class="tile" style="background:hsl(${hue(p.id)},35%,38%)">${esc(p.en[0])}</div><b>${esc(p.en)}</b><span class="mut">${ETB(p.price)}</span></button>`).join('')||'<p class="mut">No products here yet.</p>'}</div>
<h2>What we do</h2><div class="g2">${[['Wholesale','Wholesale for traders','Bulk orders with a quote'],['Custom design','Custom designs','Send a photo, we sew it'],['Abroad','Delivery abroad','Your design, your date'],['Custom design','Fabric sourcing','We deliver the fabric you choose']].map(s=>`<button class="card sv" data-a="svc" data-v="${s[0]}"><b>${s[1]}</b><span class="mut">${s[2]}</span></button>`).join('')}</div>`}
function reqv(){return `<h1 style="margin:8px 0">Request an order</h1><div class="rw">${chips(Object.keys(FLD),S.tab,'tab')}</div><div class="fg">${F('rn','Full name')}${F('rph','Phone','tel','09…')}${FLD[S.tab].map((f,i)=>F('q'+i,f[0],f[1])).join('')}</div><label class="lb" for="qn">Notes</label><textarea class="in" id="qn" rows="3"></textarea><div class="rw end"><button class="btn acc" data-a="sreq">Send request</button></div>`}
function acct(){
if(S.adm)return `<div class="card" style="max-width:380px;margin:24px auto"><h2 style="margin-top:0">Admin</h2><p class="mut">You’re signed in as admin.</p><div class="rw end"><button class="chip" data-a="alogout">Log out</button><button class="btn acc" data-a="adm">Open admin</button></div></div>`;if(!S.user)return `<div class="card" style="max-width:380px;margin:24px auto"><h2 style="margin-top:0">${t('in')}</h2><div class="rw">${chips(['Customer','Admin'],S.role==='Admin'?'Admin':'Customer','role')}</div>${S.role==='Admin'?`<p class="mut">Staff only. Demo login: admin / admin123</p>${F('au','Username')}${F('ap','Password','password')}<div class="rw end"><button class="btn acc" data-a="alogin">Sign in</button></div>`:`<p class="mut">Use your phone number. We send you a code.</p>${S.step?`${F('sc','6-digit code','text','123456')}<div class="rw end"><button class="chip" data-a="back">Change number</button><button class="btn acc" data-a="verify">Verify</button></div>`:`${F('sp','Phone number','tel','09…')}<div class="rw end"><button class="btn acc" data-a="sendc">Send code</button></div>`}<p class="mut">Demo: the code is always 123456.</p>`}</div>`;
const ph=dg(S.user.phone),os=DB.orders.filter(o=>dg(o.phone)===ph),rs=DB.reqs.filter(r=>dg(r.phone)===ph);
return `<h1 style="margin:8px 0">My account</h1><div class="rw"><div style="flex:1;min-width:200px">${F('an','Your name','text','Name')}</div><button class="chip" data-a="asave">Save</button><button class="chip" data-a="out">Sign out</button></div><p class="mut">${esc(S.user.phone)}</p><div class="rw">${[['orders','Orders'],['reqs','Requests']].map(x=>`<button class="chip${S.acct===x[0]?' on':''}" data-a="at" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><div style="margin-top:12px">${S.acct==='orders'?(os.map(o=>{const ix=ST.indexOf(o.status);return `<div class="card"><div class="li"><b>${o.id}</b>${tg(o.status)}</div><div class="mut">${esc(o.type)} · ${esc(o.desc)} · ${ETB(o.total)}</div><div class="bar">${ST.map((s,i)=>`<i class="${i<ix||ix===3?'d':i===ix?'c':''}"></i>`).join('')}</div><div class="mut">${ST.join(' › ')}</div></div>`}).join('')||'<p class="mut">No orders yet. Order a dress from Home.</p>'):(rs.map(r=>`<div class="card"><div class="li"><b>${esc(r.type)}</b>${tg(r.status)}</div><div class="mut">${Object.entries(r.d).map(e=>esc(e[0])+': '+esc(e[1])).join(' · ')}${r.quote?'<br>Quote: '+ETB(r.quote):''}</div></div>`).join('')||'<p class="mut">No requests yet.</p>')}</div>`}
/* ---------- admin ---------- */
function loginV(){return `<div class="ct" style="max-width:380px;padding-top:60px"><h1 style="margin:0">Admin sign in</h1><p class="mut">Staff only. Demo login: admin / admin123</p>${F('au','Username')}${F('ap','Password','password')}<div class="rw end"><button class="chip" data-a="shop">Back to the shop</button><button class="btn acc" data-a="alogin">Sign in</button></div></div>`}
function custs(){const m={},add=(x,k)=>{const p=dg(x.phone),c=m[p]=m[p]||{ph:p,phone:x.phone,name:x.name,o:0,r:0,last:''};c[k]++;if(x.date>c.last)c.last=x.date};DB.orders.forEach(x=>add(x,'o'));DB.reqs.forEach(x=>add(x,'r'));return Object.values(m)}
const has=(q,...a)=>!q||a.join(' ').toLowerCase().includes(q.toLowerCase());
function adminV(){const NV=[['dash','Dashboard'],['ord','Orders'],['prod','Products'],['req','Requests'],['cus','Customers'],['set','Settings']];
return `<div class="ad"><aside class="sb"><b>True Clothing</b>${NV.map(n=>`<button class="nv${S.ar===n[0]?' on':''}" data-a="ar" data-v="${n[0]}">${n[1]}</button>`).join('')}<button class="nv" data-a="shop">View shop</button><button class="nv" data-a="alogout" style="margin-top:auto">Log out</button></aside><main class="mn">${({dash,ord:ordV,prod:prodV,req:reqAV,cus:cusV,set:setV})[S.ar]()}</main></div>`}
function dash(){const o=DB.orders,att=[...o.filter(x=>x.status==='Received').map(x=>[x.id+' · '+x.name,'New order',`data-a="oo" data-v="${x.id}"`,'Received']),...DB.reqs.filter(x=>x.status==='New').map(x=>[x.name,x.type+' request',`data-a="rs2" data-v="${x.id}"`,'New'])];
return `<h1>Dashboard</h1><div class="rw" style="margin-bottom:12px"><button class="btn out" data-a="pnew">Add product</button><button class="btn acc" data-a="nord">Add order</button></div><div class="st">${[['New orders',o.filter(x=>x.status==='Received').length],['Open requests',DB.reqs.filter(x=>x.status==='New').length],['In production',o.filter(x=>x.status==='In production').length],['Customers',custs().length]].map(s=>`<div class="card"><span class="mut">${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div><div class="two" style="grid-template-columns:1.3fr 1fr"><div class="card"><b>Needs attention</b>${att.map(a=>`<div class="li"><span>${esc(a[0])}<div class="mut">${a[1]}</div></span>${tg(a[3])}<button class="chip" ${a[2]}>Open</button></div>`).join('')||'<p class="mut">Nothing waiting.</p>'}</div><div class="card"><b>Recent activity</b>${DB.log.map(l=>`<div class="li">${esc(l)}</div>`).join('')}</div></div>`}
function ordV(){const l=DB.orders.filter(o=>(S.of==='All'||o.status===S.of)&&has(S.q,o.id,o.name,o.phone));
return `<div class="rw" style="justify-content:space-between"><h1>Orders</h1><div class="rw"><input class="in" id="q" placeholder="Search name or phone" aria-label="Search" style="width:220px"><button class="btn acc" data-a="nord">Add order</button></div></div><div class="rw sc">${chips(['All',...ST],S.of,'of')}</div><div class="tb"><div class="tr th"><span>ID</span><span>Customer</span><span>Type</span><span>Status</span><span>Total</span><span></span></div>${l.map(o=>`<div class="tr"><span>${o.id}</span><span>${esc(o.name)}</span><span>${esc(o.type)}</span><span>${tg(o.status)}</span><span>${ETB(o.total)}</span><button class="chip" data-a="oo" data-v="${o.id}">Open</button></div>`).join('')||'<div class="tr mut">No orders match.</div>'}</div>`}
function prodV(){return `<div class="rw" style="justify-content:space-between"><h1>Products</h1><button class="btn acc" data-a="pnew">Add product</button></div><div class="tb"><div class="tr th"><span>#</span><span>Name</span><span>Category</span><span>Price</span><span>Published</span><span></span></div>${DB.prods.map((p,i)=>`<div class="tr"><span>${i+1}</span><span>${esc(p.en)}</span><span>${p.cat}</span><span>${ETB(p.price)}</span><label class="ck"><input type="checkbox" data-c="pub" data-id="${p.id}"${p.pub?' checked':''} aria-label="Published">${p.pub?'Yes':'No'}</label><span class="rw"><button class="chip" data-a="pedit" data-v="${p.id}">Edit</button><button class="chip" data-a="pdel" data-v="${p.id}">${S.del===p.id?'Sure?':'Delete'}</button></span></div>`).join('')}</div>`}
function reqAV(){const l=DB.reqs.filter(r=>S.rf==='All'||r.type===S.rf),r=rq(S.sel)||l[0];
return `<h1>Requests</h1><div class="rw sc">${chips(['All','Custom design','Wholesale','Abroad'],S.rf,'rf')}</div><div class="two"><div>${l.map(x=>`<button class="card sv${r&&r.id===x.id?' sel':''}" style="width:100%" data-a="rsel" data-v="${x.id}">${tg(x.type==='Wholesale'?'Quoted':x.type==='Abroad'?'Shipped':'Received').replace(/>[^<]*</,'>'+x.type+'<')}<b style="margin-top:6px">${esc(x.name)}</b><span class="mut">${x.date} · ${x.status}</span></button>`).join('')||'<p class="mut">No requests.</p>'}</div>${r?`<div class="card"><div class="li"><b style="font-size:18px">${esc(r.name)}</b>${tg(r.status)}</div><p class="mut">${esc(r.phone)} · ${esc(r.type)} · ${r.date}</p><div class="mut" style="line-height:1.9">${Object.entries(r.d).map(e=>`${esc(e[0])}: ${esc(e[1])}`).join('<br>')||'No details.'}</div>${F('rqp','Quote price (ETB)','number')}<div class="rw end"><button class="btn out" data-a="rdec">Decline</button><button class="btn" data-a="rconv">Convert to order</button><button class="btn acc" data-a="rquote">Send quote</button></div></div>`:''}</div>`}
function cusV(){const l=custs().filter(c=>has(S.q,c.name,c.phone));
return `<div class="rw" style="justify-content:space-between"><h1>Customers</h1><input class="in" id="q" placeholder="Search name or phone" aria-label="Search" style="width:220px"></div><div class="tb"><div class="tr th"><span>#</span><span>Name</span><span>Phone</span><span>Orders</span><span>Requests</span><span></span></div>${l.map((c,i)=>`<div class="tr"><span>${i+1}</span><span>${esc(c.name)}</span><span>${esc(c.phone)}</span><span>${c.o}</span><span>${c.r}</span><button class="chip" data-a="cus" data-v="${c.ph}">Open</button></div>`).join('')||'<div class="tr mut">No customers yet.</div>'}</div>`}
function setV(){const s=DB.set,K=[['aO','Alert on new orders'],['aR','Alert on new requests'],['telebirr','Telebirr'],['cbe','CBE Birr'],['bank','Bank transfer']];
return `<h1>Settings</h1><div class="card"><b>Business</b><div class="fg"><div><label class="lb" for="sn">Business name</label><input class="in" id="sn" value="${esc(s.name)}"></div><div><label class="lb" for="sp2">Phone</label><input class="in" id="sp2" value="${esc(s.phone)}"></div></div><label class="lb" for="st">Telegram channel</label><input class="in" id="st" value="${esc(s.tg)}"></div><div class="card"><b>Alerts and payments</b>${K.map(k=>`<label class="ck"><input type="checkbox" id="k_${k[0]}"${s[k[0]]?' checked':''}>${k[1]}</label>`).join('')}</div><div class="rw end" style="justify-content:space-between"><button class="chip" data-a="reset">Reset demo data</button><button class="btn acc" data-a="sset">Save settings</button></div>`}
/* ---------- modals ---------- */
function modal(){const m=S.modal;
if(m.k==='prod'){const p=prod(m.id);return `<h3>${esc(p.en)}</h3><p class="mut">${esc(p.desc)}</p><b>${ETB(p.price)}</b>${p.sizes.length?`<label class="lb">Size</label><div class="rw">${chips(p.sizes,m.size,'msz')}</div>`:''}<label class="lb">Quantity</label><div class="rw"><button class="chip" data-a="mq" data-v="-1" aria-label="Less">−</button><b>${m.qty}</b><button class="chip" data-a="mq" data-v="1" aria-label="More">+</button></div>${F('f1','Name')}${F('f2','Phone','tel')}<div class="rw end"><button class="btn out" data-a="cl">Cancel</button><button class="btn acc" data-a="buy">${t('order')} · ${ETB(p.price*m.qty)}</button></div>`}
if(m.k==='ord'){const o=ord(m.id);return `<h3>Order ${o.id}</h3><p class="mut">${esc(o.name)} · ${esc(o.phone)}<br>${esc(o.type)}: ${esc(o.desc)}</p><label class="lb">Status</label><div class="rw">${chips(ST,m.st,'ost')}</div><div class="fg"><div><label class="lb" for="ot">Total (ETB)</label><input class="in" id="ot" type="number" value="${o.total}"></div><div><label class="lb" for="op">Payment</label><select class="in" id="op">${['Unpaid','Partly paid','Paid'].map(x=>`<option${o.pay===x?' selected':''}>${x}</option>`).join('')}</select></div></div><div class="rw end"><button class="chip" data-a="odel">Delete</button><button class="btn out" data-a="onote">Notify on Telegram</button><button class="btn acc" data-a="osave">Save</button></div>`}
if(m.k==='nord')return `<h3>Add order</h3>${F('nn','Customer name')}${F('np','Phone','tel')}<label class="lb" for="nt">Type</label><select class="in" id="nt"><option>Ready-made</option><option>Custom design</option><option>Wholesale</option><option>Abroad</option></select>${F('nd','Description')}${F('nm','Total (ETB)','number')}<div class="rw end"><button class="btn out" data-a="cl">Cancel</button><button class="btn acc" data-a="nsave">Add order</button></div>`;
if(m.k==='pm'){const p=m.id?prod(m.id):{};return `<h3>${m.id?'Edit':'Add'} product</h3><label class="lb" for="pn">Name</label><input class="in" id="pn" value="${esc(p.en||'')}"><div class="fg"><div><label class="lb" for="pc">Category</label><select class="in" id="pc">${['Shifon','Habesha','Fabric'].map(c=>`<option${p.cat===c?' selected':''}>${c}</option>`).join('')}</select></div><div><label class="lb" for="pp">Price (ETB)</label><input class="in" id="pp" type="number" value="${p.price||''}"></div></div><label class="lb" for="ps">Sizes (comma separated)</label><input class="in" id="ps" value="${esc((p.sizes||['S','M','L']).join(', '))}"><label class="lb" for="pd">Description</label><textarea class="in" id="pd" rows="3">${esc(p.desc||'')}</textarea><label class="ck"><input type="checkbox" id="pb"${p.pub===0?'':' checked'}>Published</label><div class="rw end"><button class="btn out" data-a="cl">Cancel</button><button class="btn acc" data-a="psave">Save product</button></div>`}
const ph=m.ph,os=DB.orders.filter(o=>dg(o.phone)===ph),rs=DB.reqs.filter(r=>dg(r.phone)===ph),c=custs().find(x=>x.ph===ph)||{};
return `<h3>${esc(c.name)}</h3><p class="mut">${esc(c.phone)}</p><b>Orders</b>${os.map(o=>`<div class="li"><span>${o.id} · ${esc(o.type)}</span>${tg(o.status)}</div>`).join('')||'<p class="mut">None.</p>'}<b>Requests</b>${rs.map(r=>`<div class="li"><span>${esc(r.type)} · ${r.date}</span>${tg(r.status)}</div>`).join('')||'<p class="mut">None.</p>'}<div class="rw end"><button class="btn out" data-a="ccall">Call</button><button class="btn out" data-a="onote">Telegram</button><button class="btn" data-a="cl">Close</button></div>`}
/* ---------- actions ---------- */
const bad=(n,p)=>(!n||dg(p).length<9)&&(toast('Enter a name and a valid phone number'),1);
const A={
go:v=>{S.route=v;S.modal=null;R(1)},role:v=>{S.role=v;R(1)},lang:()=>{S.lang=S.lang==='en'?'am':'en';R()},cat:v=>{S.cat=v;R()},scr:()=>$('#grid').scrollIntoView({behavior:'smooth'}),
prod:v=>{S.modal={k:'prod',id:v,size:prod(v).sizes[0]||'',qty:1};R(1)},msz:v=>{S.modal.size=v;R()},mq:v=>{S.modal.qty=Math.max(1,S.modal.qty+ +v);R()},cl:()=>{S.modal=null;R(1)},
buy:()=>{const n=$('#f1').value.trim(),ph=$('#f2').value.trim(),p=prod(S.modal.id);if(bad(n,ph))return;DB.orders.unshift({id:nid(),name:n,phone:ph,type:'Ready-made',desc:p.en+' ×'+S.modal.qty+(S.modal.size?' ('+S.modal.size+')':''),total:p.price*S.modal.qty,status:'Received',pay:'Unpaid',date:today()});log('New order from '+n);save();S.modal=null;toast('Order sent. We’ll call you to confirm.');R(1)},
svc:v=>{S.route='req';S.tab=v;R(1)},tab:v=>{S.tab=v;R(1)},
sreq:()=>{const n=$('#rn').value.trim(),ph=$('#rph').value.trim();if(bad(n,ph))return;const d={};FLD[S.tab].forEach((f,i)=>{const v=$('#q'+i).value.trim();if(v)d[f[0]]=v});const nt=$('#qn').value.trim();if(nt)d.Notes=nt;DB.reqs.unshift({id:uid(),type:S.tab,name:n,phone:ph,d,status:'New',quote:'',date:today()});log('New '+S.tab+' request from '+n);save();toast('Request sent. We’ll reply on Telegram or by phone.');S.route=S.user?'acc':'home';S.acct='reqs';R(1)},
sendc:()=>{const p=$('#sp').value.trim();if(dg(p).length<9)return toast('Enter a valid phone number');S.ph=p;S.step=1;toast('Demo: your code is 123456');R(1)},back:()=>{S.step=0;R(1)},
verify:()=>{if($('#sc').value.trim()==='123456'){S.user={phone:S.ph,name:''};S.step=0;R(1)}else toast('Wrong code')},asave:()=>{S.user.name=$('#an').value.trim();toast('Saved');R()},out:()=>{S.user=null;S.step=0;R(1)},at:v=>{S.acct=v;R()},
adm:()=>{S.admin=1;R(1)},shop:()=>{S.admin=0;S.modal=null;R(1)},alogin:()=>{if($('#au').value.trim()==='admin'&&$('#ap').value==='admin123'){S.adm=1;S.admin=1;S.ar='dash';R(1)}else toast('Wrong username or password')},alogout:()=>{S.adm=0;S.admin=0;S.route='acc';S.role='Admin';R(1)},
ar:v=>{S.ar=v;S.q='';S.of='All';S.sel=null;R(1)},of:v=>{S.of=v;R()},rf:v=>{S.rf=v;S.sel=null;R(1)},rsel:v=>{S.sel=v;R(1)},rs2:v=>{S.ar='req';S.sel=v;S.rf='All';R(1)},
oo:v=>{S.modal={k:'ord',id:v,st:ord(v).status};R(1)},ost:v=>{S.modal.st=v;R()},
osave:()=>{const o=ord(S.modal.id);o.status=S.modal.st;o.total=+$('#ot').value||0;o.pay=$('#op').value;log('Order '+o.id+' is now '+o.status);save();S.modal=null;toast('Order saved');R(1)},
onote:()=>toast('Telegram message sent (demo)'),ccall:()=>toast('Calling (demo)'),odel:()=>{DB.orders=DB.orders.filter(o=>o.id!==S.modal.id);save();S.modal=null;toast('Order deleted');R(1)},
nord:()=>{S.modal={k:'nord'};R(1)},nsave:()=>{const n=$('#nn').value.trim(),p=$('#np').value.trim();if(bad(n,p))return;DB.orders.unshift({id:nid(),name:n,phone:p,type:$('#nt').value,desc:$('#nd').value.trim()||'Manual order',total:+$('#nm').value||0,status:'Received',pay:'Unpaid',date:today()});log('Order added for '+n);save();S.modal=null;toast('Order added');R(1)},
pnew:()=>{S.modal={k:'pm',id:null};R(1)},pedit:v=>{S.modal={k:'pm',id:v};R(1)},
psave:()=>{const n=$('#pn').value.trim(),pr=+$('#pp').value;if(!n||!(pr>0))return toast('Enter a name and a price');const o={en:n,cat:$('#pc').value,price:pr,sizes:$('#ps').value.split(',').map(x=>x.trim()).filter(Boolean),desc:$('#pd').value.trim(),pub:$('#pb').checked?1:0};if(S.modal.id)Object.assign(prod(S.modal.id),o);else DB.prods.push({id:'p'+uid(),...o});log('Product saved: '+n);save();S.modal=null;toast('Product saved');R(1)},
pdel:v=>{if(S.del===v){DB.prods=DB.prods.filter(p=>p.id!==v);S.del=null;save();toast('Product deleted')}else S.del=v;R(1)},
rquote:()=>{const r=rq(S.sel||DB.reqs.filter(x=>S.rf==='All'||x.type===S.rf)[0].id),q=+$('#rqp').value;if(!(q>0))return toast('Enter a quote price');r.quote=q;r.status='Quoted';log('Quote sent to '+r.name);save();toast('Quote sent (demo)');R(1)},
rconv:()=>{const r=rq(S.sel||DB.reqs.filter(x=>S.rf==='All'||x.type===S.rf)[0].id);DB.orders.unshift({id:nid(),name:r.name,phone:r.phone,type:r.type,desc:Object.entries(r.d).map(e=>e[0]+': '+e[1]).join('; '),total:r.quote||+$('#rqp').value||0,status:'Received',pay:'Unpaid',date:today()});r.status='Converted';log('Request from '+r.name+' became an order');save();S.ar='ord';toast('Converted to an order');R(1)},
rdec:()=>{const r=rq(S.sel||DB.reqs.filter(x=>S.rf==='All'||x.type===S.rf)[0].id);r.status='Declined';log('Request from '+r.name+' declined');save();R(1)},
cus:v=>{S.modal={k:'cus',ph:v};R(1)},
sset:()=>{const s=DB.set;s.name=$('#sn').value;s.phone=$('#sp2').value;s.tg=$('#st').value;['aO','aR','telebirr','cbe','bank'].forEach(k=>s[k]=$('#k_'+k).checked?1:0);save();toast('Settings saved');R(1)},
reset:()=>{try{localStorage.removeItem('tc1')}catch(e){}DB=seed();S.user=null;S.sel=null;toast('Demo data reset');R(1)}};
document.addEventListener('click',e=>{if(e.target.id==='ov'){A.cl();return}const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v,b)});
document.addEventListener('change',e=>{if(e.target.dataset.c==='pub'){const p=prod(e.target.dataset.id);p.pub=e.target.checked?1:0;save();toast(p.pub?'Published':'Hidden from the shop');R()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;R()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ap')A.alogin()});
draw();
</script>
</body>
</html>
